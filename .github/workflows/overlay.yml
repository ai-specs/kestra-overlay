name: overlay-build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  patch-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify and apply thin patches (upstream pinned BASE)
        run: ./scripts/build.sh --apply-only
  build-push:
    needs: patch-verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build overlay image and push to ghcr.io/ai-specs
        run: ./scripts/build.sh
