name: overlay-build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
concurrency:
  group: overlay-release
  cancel-in-progress: true
jobs:
  patch-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Structural gate (manifest/patch consistency, no overlap, headers)
        run: ./scripts/check-patches.sh
      - name: Patch provenance checker regression fixtures
        run: ./scripts/check-patches-fixture.sh
      - name: Executable manifest Class-Path harness regression tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Verify thin patches apply cleanly on pinned BASE (no compile)
        run: ./scripts/build.sh --apply-only
  build-push:
    needs: patch-verify
    outputs:
      image: ${{ steps.candidate.outputs.image }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # NOTE: upstream compiles with `-Xlint:all` (build.gradle:568 at BASE),
      # so the build-push log carries javac lint annotations
      # ([serial]/[rawtypes]/[this-escape]/...). They are upstream source
      # noise that varies with each upstream version — expected, do not chase
      # and do not filter (maintainer ruling 2026-10-07: build-harness-level
      # -Xlint suppression was tried and rejected; warnings stay visible).
      - name: Cache gradle (upstream BASE keyed)
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ github.repository }}-${{ hashFiles('patches/BASE') }}
          restore-keys: gradle-${{ github.repository }}-
      - name: Set up JDK 25 (webserver toolchain)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
        # NOTE: no `cache: gradle` here — the overlay repo (checked-out
        # workspace) contains no gradle files; gradle lives in the upstream
        # clone ($WORK). setup-java's cache:gradle would fail its key lookup.
        # Gradle cache is handled by actions/cache keyed on upstream BASE.
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Set up Node.js for upstream UI
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Shared SDK browser adapter regression tests
        run: node --test scripts/tests/ui-sdk-browser-driver.test.cjs scripts/tests/sdk-browser-diagnostics.test.cjs scripts/tests/favicon-browser-diagnostics.test.mjs scripts/rbac-ui-probe/sdk-canonical.test.mjs scripts/rbac-ui-probe/sdk-theme.test.mjs scripts/rbac-ui-probe/sdk-evidence.test.mjs
      - name: Apply patches, compile UI/webserver, build and push candidate
        id: candidate
        env:
          WORK: ${{ github.workspace }}/.work/verify
        run: ./scripts/build.sh
      - name: Independent classpath authorization SPI bean discovery probe
        env:
          CANDIDATE_IMAGE: ${{ steps.candidate.outputs.image }}
          RBAC_PROBE_OUTPUT: ${{ github.workspace }}/.work/host-extension-probe.jar
        run: bash ./scripts/blackbox-classpath.sh "${{ github.workspace }}/.work/verify" "${{ github.workspace }}/.work/verify/docker/app/kestra" "$CANDIDATE_IMAGE"
      - name: Preserve own-source inputs for the independent SDK browser job
        run: |
          mkdir -p .work/verify/sdk-ci-inputs
          tar -C .work/verify -czf .work/verify/sdk-ci-inputs/host-ui-sdk-inputs.tar.gz \
            webserver/src/main/resources/META-INF/kestra/ui-sdk/v1 ui/src/extensions ui/src/utils/csrf.ts
          (cd .work/verify/sdk-ci-inputs && sha256sum host-ui-sdk-inputs.tar.gz > host-ui-sdk-inputs.sha256)
      - name: Upload host-owned SDK browser inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-ui-sdk-probe-inputs
          path: .work/verify/sdk-ci-inputs/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Preserve scoped backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-scoped-tests
          path: |
            .work/verify/webserver/build/test-results/test/*.xml
            .work/verify/webserver/build/reports/tests/test/
          include-hidden-files: true
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: host-owned-extension-probe
          path: .work/host-extension-probe.jar
          include-hidden-files: true
          if-no-files-found: error
      - name: Preserve complete UI unit matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-ui-unit-tests
          path: .work/verify/ui/build/reports/ui-extension-tests.json
          include-hidden-files: true
          if-no-files-found: warn
      - name: MCP OAuth image acceptance with real SDK and zero-side-effect scope denial
        env:
          CANDIDATE_IMAGE: ${{ steps.candidate.outputs.image }}
          BB_REPORT_DIR: ${{ github.workspace }}/.work/mcp-image-tests
        run: bash ./scripts/blackbox-mcp-oauth.sh "$CANDIDATE_IMAGE" "${{ github.workspace }}/.work/verify"
      - name: Preserve image-only fixture and SDK test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-mcp-image-tests
          path: .work/mcp-image-tests/*.xml
          include-hidden-files: true
          if-no-files-found: warn
  oidc-blackbox:
    needs: build-push
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v4
        with:
          name: host-owned-extension-probe
          path: .work/host-extension-probe
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: "Image-level OIDC black-box (two phases: gated-off regression + full flow)"
        env:
          CANDIDATE_IMAGE: ${{ needs.build-push.outputs.image }}
        run: ./scripts/blackbox-oidc.sh "$CANDIDATE_IMAGE"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: UI interception, password login, OIDC callback and authenticated UI/API
        env:
          BB_BROWSER: '1'
          BB_UI_EXTENSION_PROBE: 'true'
          BB_UI_EXTENSION_JAR: ${{ github.workspace }}/.work/host-extension-probe/host-extension-probe.jar
          NODE_PATH: ${{ runner.temp }}/oidc-browser/node_modules
          CANDIDATE_IMAGE: ${{ needs.build-push.outputs.image }}
        run: |
          npm install --prefix "$RUNNER_TEMP/oidc-browser" playwright@1.61.1
          "$RUNNER_TEMP/oidc-browser/node_modules/.bin/playwright" install --with-deps chromium
          bash ./scripts/blackbox-ui-oidc.sh "$CANDIDATE_IMAGE"
          BB_SETUP_MODE=env bash ./scripts/blackbox-ui-oidc.sh "$CANDIDATE_IMAGE"
      - name: Publish authentication theme browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authentication-theme-browser
          path: |
            .work/auth-theme-*.json
            .work/auth-i18n-*.json
            .work/password-change-*.json
            .work/password-rbac-*.json
            .work/directory-http-*.json
            .work/profile-directory-*.json
            .work/favicon-*.json
            .work/identity-recheck-*.json
            .work/ui-extension-*.json
          include-hidden-files: true
          if-no-files-found: error
  ui-sdk-blackbox:
    needs: build-push
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: host-ui-sdk-probe-inputs
          path: .work/host-ui-sdk-inputs
      - name: Prepare exact own-source SDK probe inputs and failure report
        run: |
          (cd .work/host-ui-sdk-inputs && sha256sum -c host-ui-sdk-inputs.sha256)
          mkdir -p .work/host-ui-sdk-tree
          tar -xzf .work/host-ui-sdk-inputs/host-ui-sdk-inputs.tar.gz -C .work/host-ui-sdk-tree
          node -e 'require("fs").writeFileSync(".work/ui-sdk-browser.json",JSON.stringify({completed:false,passedGate:false,expectedRows:949,rows:[],notRun:949,phase:"probe-build"}))'
      - name: Build host-owned SDK probe without business plugins
        env:
          SDK_DEV_TREE: ${{ github.workspace }}/.work/host-ui-sdk-tree
        run: bash ./scripts/rbac-ui-probe/sdk-run.sh
      - name: Run the same complete949-row SDK matrix through Playwright
        env:
          UI_SDK_PROBE_DIR: ${{ github.workspace }}/.work/host-ui-sdk-tree/sdk-probe/dist
          UI_SDK_BROWSER_REPORT: ${{ github.workspace }}/.work/ui-sdk-browser.json
          UI_SDK_BROWSER_FAILURES: ${{ github.workspace }}/.work/ui-sdk-browser-failures
          CANDIDATE_IMAGE: ${{ needs.build-push.outputs.image }}
          NODE_PATH: ${{ runner.temp }}/sdk-browser/node_modules
        run: |
          npm install --prefix "$RUNNER_TEMP/sdk-browser" playwright@1.61.1
          "$RUNNER_TEMP/sdk-browser/node_modules/.bin/playwright" install --with-deps chromium
          node ./scripts/blackbox-ui-sdk.cjs
      - name: Preserve SDK matrix including partial failures and document diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-sdk-browser
          path: |
            .work/ui-sdk-browser.json
            .work/ui-sdk-browser-failures/
          include-hidden-files: true
          if-no-files-found: error
  promote:
    needs: [build-push, oidc-blackbox, ui-sdk-blackbox]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Promote verified immutable candidate to deployment tags
        env:
          CANDIDATE_IMAGE: ${{ needs.build-push.outputs.image }}
        run: bash ./scripts/promote-image.sh "$CANDIDATE_IMAGE"
