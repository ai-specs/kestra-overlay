name: overlay-build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply thin patches (upstream pinned BASE)
        run: ./scripts/build.sh --apply-only
      # build-image step enabled after extension repos carry buildable sources
      # (see scripts/build-extensions.sh) — avoids failing CI on placeholder
