<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shadow UI probe</title><style>@font-face{font-family:Inter;src:url('/host-inter.woff2') format('woff2');font-weight:100 900}body{font-family:Inter,sans-serif;margin:13px;color:rgb(24,35,46);background:rgb(240,241,242)}#sentinel{padding:7px;border:2px solid rgb(70,80,90)}button{font:inherit}</style></head><body><aside id="sentinel">Host sentinel</aside><button id="dispose">Dispose shadow</button><div id="shadow-extension"></div><script type="module">
window.shadowErrors=[];window.addEventListener('error',event=>shadowErrors.push({message:event.message,source:event.filename}));window.addEventListener('unhandledrejection',event=>shadowErrors.push(String(event.reason)));
window.sampleHost=()=>{const style=getComputedStyle(document.querySelector('#sentinel'));const body=getComputedStyle(document.body);return {font:style.fontFamily,color:style.color,padding:style.padding,border:style.border,bodyMargin:body.margin,bodyBackground:body.backgroundColor,headStyles:document.head.querySelectorAll('style,link[rel=stylesheet]').length}};
await document.fonts.load('16px Inter');window.beforeShadow=sampleHost();const module=await import('/shadow/extension.js');window.shadowController=new AbortController();window.shadowContext={version:1,locale:'fr',theme:'light',themePreference:'light',signal:shadowController.signal};window.shadowHandle=await module.mount(document.querySelector('#shadow-extension'),shadowContext);window.systemMedia=matchMedia('(prefers-color-scheme: dark)');window.setShadowPreference=async preference=>{const theme=preference==='system'?(systemMedia.matches?'dark':'light'):preference;shadowContext={...shadowContext,theme,themePreference:preference};await shadowHandle.update(shadowContext)};systemMedia.addEventListener('change',()=>{if(shadowContext.themePreference==='system')setShadowPreference('system')});document.querySelector('#dispose').onclick=()=>shadowHandle.unmount();window.shadowReady=true;
</script></body></html>
