// kestra-overlay build init script — quiet upstream lint noise (build-harness level).
//
// Upstream compiles every module with -Xlint:all (build.gradle:568 at BASE
// v2.0.5), so building from source emits ~11 known javac lint warnings
// ([serial]/[rawtypes]/[unchecked]/[deprecation]/[this-escape]/[dep-ann])
// that GitHub turns into Actions annotations. None of them point at
// overlay-patched files; truly fixing them means editing upstream sources or
// build files (banned: build face, AGENTS.md §2).
//
// Lint flags do not affect bytecode — dropping them only quiets the log.
// This file is passed via `./gradlew -I` from scripts/build.sh: no upstream
// file is touched, no patch involved, exit codes still flow untouched.
gradle.projectsEvaluated {
    allprojects {
        tasks.withType(JavaCompile).configureEach {
            options.compilerArgs = options.compilerArgs.findAll { !it.startsWith("-Xlint") }
        }
    }
}
